<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <title>Moss &amp; Marrow — Voxel Garden</title>
    <style>
      :root {
        --ink: #173f35;
        --pine: #14543e;
        --paper: #fff9e9;
        --gold: #f5bf4f;
        --line: rgba(22, 67, 52, 0.18);
        --shadow: rgba(22, 53, 42, 0.2);
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #d7dbec;
        color: var(--ink);
        font-family: ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
      }
      button {
        font: inherit;
        color: inherit;
      }
      #app {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #d8d9ef;
      }
      #world {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        outline: 0;
      }
      .glass {
        background: rgba(255, 249, 233, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.86);
        box-shadow: 0 8px 28px var(--shadow);
        backdrop-filter: blur(13px);
      }
      .top {
        position: absolute;
        top: max(10px, env(safe-area-inset-top));
        left: max(10px, env(safe-area-inset-left));
        right: max(10px, env(safe-area-inset-right));
        display: flex;
        gap: 8px;
        align-items: center;
        pointer-events: none;
      }
      .brand,
      .modes,
      .actions {
        pointer-events: auto;
        border-radius: 18px;
      }
      .brand {
        height: 54px;
        padding: 7px 13px 7px 8px;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .logo {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: var(--pine);
        font-size: 22px;
      }
      .brand b {
        display: block;
        font:
          700 18px/1 Georgia,
          serif;
      }
      .brand small {
        font-size: 9px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #687d71;
      }
      .modes,
      .actions {
        display: flex;
        padding: 5px;
        gap: 3px;
      }
      .actions {
        margin-left: auto;
      }
      .mode,
      .action {
        height: 44px;
        border: 0;
        border-radius: 13px;
        background: transparent;
        font-weight: 850;
        font-size: 13px;
        padding: 0 13px;
      }
      .mode[aria-pressed="true"] {
        background: var(--pine);
        color: white;
      }
      .action {
        min-width: 47px;
        padding: 3px 8px;
      }
      .action span {
        display: block;
        font-size: 18px;
        line-height: 1;
      }
      .action small {
        font-size: 9px;
      }
      .action:disabled {
        opacity: 0.32;
      }
      .action:hover {
        background: white;
      }
      .environment {
        position: absolute;
        top: 75px;
        left: max(12px, env(safe-area-inset-left));
        display: flex;
        gap: 6px;
      }
      .envset {
        display: flex;
        gap: 2px;
        padding: 4px;
        border-radius: 15px;
      }
      .env {
        height: 43px;
        min-width: 47px;
        padding: 3px 6px;
        border: 0;
        border-radius: 11px;
        background: transparent;
        font-size: 10px;
        font-weight: 850;
      }
      .env span {
        display: block;
        font-size: 18px;
      }
      .env[aria-pressed="true"] {
        background: white;
        box-shadow: 0 2px 8px rgba(20, 60, 45, 0.14);
      }
      .save {
        position: absolute;
        right: 16px;
        top: 76px;
        border-radius: 20px;
        padding: 6px 10px;
        background: rgba(20, 70, 52, 0.78);
        color: white;
        font-size: 10px;
      }
      .save.bad {
        background: #a3503d;
      }
      .bottom {
        position: absolute;
        z-index: 4;
        left: 50%;
        bottom: max(10px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        width: min(980px, calc(100% - 20px));
        pointer-events: none;
      }
      .caption {
        width: max-content;
        max-width: 100%;
        margin: 0 auto 7px;
        padding: 7px 13px;
        border-radius: 99px;
        background: rgba(18, 66, 49, 0.91);
        color: white;
        text-align: center;
        font-size: 12px;
        font-weight: 800;
      }
      .tray,
      .subtray {
        pointer-events: auto;
        display: flex;
        gap: 8px;
        padding: 9px;
        border-radius: 21px;
        overflow-x: auto;
        overscroll-behavior: contain;
        scrollbar-width: none;
      }
      .tray::-webkit-scrollbar,
      .subtray::-webkit-scrollbar {
        display: none;
      }
      .subtray {
        display: none;
        position: absolute;
        left: 50%;
        bottom: 88px;
        transform: translateX(-50%);
        max-width: min(700px, calc(100vw - 24px));
      }
      .subtray.open {
        display: flex;
      }
      .choice {
        flex: 0 0 77px;
        height: 68px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fffdf4;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        font-size: 10px;
        font-weight: 850;
      }
      .choice i {
        font-style: normal;
        font-size: 24px;
        line-height: 1;
      }
      .choice[aria-pressed="true"] {
        background: var(--gold);
        border-color: #b88128;
        box-shadow: 0 5px 0 #c48a29;
        transform: translateY(-2px);
      }
      .card {
        position: absolute;
        right: 14px;
        top: 133px;
        width: 230px;
        min-height: 100px;
        padding: 14px;
        border-radius: 18px;
        transition: 0.2s;
        pointer-events: none;
      }
      .card.hidden {
        opacity: 0;
        transform: translateX(12px);
      }
      .card h2 {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        font:
          700 18px Georgia,
          serif;
      }
      .card h2 span {
        font-size: 27px;
      }
      .stage {
        margin: 7px 0 5px;
        font-size: 12px;
        font-weight: 850;
        color: #34705b;
      }
      .message {
        font-size: 12px;
        line-height: 1.4;
        color: #526d61;
      }
      .fast {
        position: absolute;
        left: 14px;
        bottom: 104px;
        padding: 7px 10px;
        border-radius: 12px;
        background: rgba(255, 249, 233, 0.82);
        font-size: 10px;
        font-weight: 750;
      }
      .toast {
        position: absolute;
        top: 135px;
        left: 50%;
        transform: translate(-50%, -8px);
        opacity: 0;
        padding: 10px 16px;
        border-radius: 99px;
        background: rgba(16, 59, 43, 0.92);
        color: white;
        font-size: 13px;
        font-weight: 800;
        transition: 0.2s;
        pointer-events: none;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .error {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        background: #e5dfd5;
        padding: 24px;
        text-align: center;
      }
      .error div {
        max-width: 440px;
        padding: 25px;
        border-radius: 20px;
        background: var(--paper);
      }
      @media (max-width: 760px) {
        .brand small {
          display: none;
        }
        .brand b {
          font-size: 15px;
        }
        .brand {
          padding-right: 9px;
        }
        .mode {
          padding: 0 9px;
        }
        .actions .action {
          min-width: 45px;
        }
        .environment {
          top: 70px;
        }
        .env {
          min-width: 42px;
          font-size: 9px;
        }
        .card {
          top: 122px;
          right: 8px;
          width: 195px;
        }
        .choice {
          flex-basis: 70px;
        }
        .fast {
          display: none;
        }
      }
      @media (max-width: 520px) {
        .brand {
          display: none;
        }
        .top {
          display: grid;
          grid-template-columns: 1fr;
          justify-items: center;
          gap: 5px;
        }
        .modes,
        .actions {
          width: max-content;
          max-width: 100%;
          margin: 0;
        }
        .mode {
          padding: 0 6px;
          font-size: 11px;
        }
        .actions .action {
          min-width: 44px;
          height: 44px;
          padding: 2px;
        }
        .top {
          justify-content: space-between;
        }
        .environment {
          top: 124px;
          max-width: calc(100% - 20px);
          overflow-x: auto;
        }
        .choice {
          height: 62px;
          flex-basis: 64px;
        }
        .choice i {
          font-size: 21px;
        }
        .tray {
          padding: 7px;
        }
        .subtray {
          bottom: 79px;
        }
        .card {
          top: 178px;
          width: 180px;
        }
        .toast {
          top: 178px;
        }
        .save {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas
        id="world"
        aria-label="A three dimensional voxel garden. Drag to turn, pinch to zoom, and use two fingers to move the view."
      ></canvas>
      <div class="top">
        <div class="brand glass">
          <span class="logo">🌱</span>
          <div>
            <small>A little world to grow</small><b>Moss &amp; Marrow</b>
          </div>
        </div>
        <div class="modes glass">
          <button id="garden-mode" class="mode" aria-pressed="true">
            🌻 Garden</button
          ><button id="build-mode" class="mode" aria-pressed="false">
            🧱 Build
          </button>
        </div>
        <div class="actions glass">
          <button id="undo" class="action" disabled>
            <span>↶</span><small>Undo</small></button
          ><button id="delete" class="action" disabled>
            <span>🗑️</span><small>Delete</small></button
          ><button id="home" class="action">
            <span>🏡</span><small>Home</small></button
          ><button id="zoom-out" class="action" aria-label="Zoom out">
            <span>−</span><small>Zoom</small></button
          ><button id="zoom-in" class="action" aria-label="Zoom in">
            <span>＋</span><small>Zoom</small></button
          ><button id="sound" class="action" aria-pressed="false">
            <span>🔇</span><small>Sound</small>
          </button>
        </div>
      </div>
      <div class="environment">
        <div id="seasons" class="envset glass">
          <button class="env" data-season="spring" aria-pressed="true">
            <span>🌸</span>Spring</button
          ><button class="env" data-season="summer">
            <span>☀️</span>Summer</button
          ><button class="env" data-season="autumn">
            <span>🍂</span>Autumn</button
          ><button class="env" data-season="winter">
            <span>❄️</span>Winter
          </button>
        </div>
        <div id="weather" class="envset glass">
          <button class="env" data-weather="sun" aria-pressed="true">
            <span>🌤️</span>Sunny</button
          ><button class="env" data-weather="rain"><span>🌧️</span>Rain</button>
        </div>
      </div>
      <div id="save" class="save">● saved</div>
      <section id="card" class="card glass hidden">
        <h2 id="plant-name"></h2>
        <div id="plant-stage" class="stage"></div>
        <div id="plant-message" class="message"></div>
      </section>
      <div class="fast">⏩ Fast garden: real plants take much longer.</div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div class="bottom">
        <div id="caption" class="caption">
          🌻 Choose a seed, then tap a soil bed
        </div>
        <div id="subtray" class="subtray glass"></div>
        <div id="tray" class="tray glass"></div>
      </div>
      <div id="error" class="error">
        <div>
          <h2>The garden could not open</h2>
          <p id="error-text"></p>
        </div>
      </div>
    </div>

    <script id="garden-model">
      (function () {
        "use strict";
        const VERSION = 2,
          STAGE_SECONDS = 25,
          MAX_BLOCKS = 240,
          BOUNDS = 18;
        const BLOCK_TYPES = Object.freeze([
          "grass",
          "soil",
          "stone",
          "wood",
          "brick",
          "roof",
          "glass",
          "water",
          "path",
          "flowers",
          "fence",
        ]);
        const TEMPLATE_TYPES = Object.freeze([
          "raisedBed",
          "bench",
          "trellis",
          "bridge",
          "beehive",
          "gazebo",
        ]);
        const SEASONS = Object.freeze(["spring", "summer", "autumn", "winter"]),
          WEATHER = Object.freeze(["sun", "rain"]);
        const SPECIES = Object.freeze({
          sunflower: Object.freeze({
            name: "Sunflower",
            emoji: "🌻",
            needsInsect: true,
            final: "Seeds",
          }),
          tomato: Object.freeze({
            name: "Tomato",
            emoji: "🍅",
            selfPollinating: true,
            final: "Fruit",
          }),
          strawberry: Object.freeze({
            name: "Strawberry",
            emoji: "🍓",
            needsInsect: true,
            final: "Fruit",
          }),
          bean: Object.freeze({
            name: "Bean",
            emoji: "🫘",
            selfPollinating: true,
            final: "Pods",
          }),
          carrot: Object.freeze({
            name: "Carrot",
            emoji: "🥕",
            rootCrop: true,
            final: "Root",
          }),
          tulip: Object.freeze({
            name: "Tulip",
            emoji: "🌷",
            flowerCrop: true,
            final: "Flower",
          }),
        });
        const STAGES = Object.freeze([
          "Seed",
          "Germination",
          "Seedling",
          "Growing plant",
          "Bud",
          "Flower",
          "Pollinated flower",
          "Fruit, vegetable or seeds",
        ]);
        function createState() {
          return {
            version: VERSION,
            season: "spring",
            weather: "sun",
            sound: false,
            elapsed: 0,
            nextId: 1,
            userBlocks: [],
            templates: [],
            plants: [],
          };
        }
        function cloneState(s) {
          return JSON.parse(JSON.stringify(s));
        }
        function snap(n) {
          return Math.round(Number(n));
        }
        function bounded(n) {
          return Number.isFinite(n) && Math.abs(n) <= BOUNDS;
        }
        const FOOTPRINT = {
          raisedBed: [2, 2],
          bench: [2, 1],
          trellis: [2, 1],
          bridge: [3, 1],
          beehive: [1, 1],
          gazebo: [3, 3],
        };
        function inFootprint(t, x, z) {
          const f = FOOTPRINT[t.type] || [1, 1];
          return Math.abs(x - t.x) <= f[0] && Math.abs(z - t.z) <= f[1];
        }
        function occupied(s, x, y, z) {
          return (
            s.userBlocks.some((b) => b.x === x && b.y === y && b.z === z) ||
            s.templates.some((t) => inFootprint(t, x, z) && y <= t.y + 4)
          );
        }
        function templateBlocked(s, type, x, z) {
          const f = FOOTPRINT[type] || [1, 1];
          if (Math.abs(x) + f[0] > BOUNDS || Math.abs(z) + f[1] > BOUNDS)
            return true;
          return (
            s.userBlocks.some(
              (b) =>
                Math.abs(b.x - x) <= f[0] &&
                Math.abs(b.z - z) <= f[1] &&
                b.y <= 4,
            ) ||
            s.plants.some(
              (p) => Math.abs(p.x - x) <= f[0] && Math.abs(p.z - z) <= f[1],
            ) ||
            s.templates.some((t) => {
              const q = FOOTPRINT[t.type] || [1, 1];
              return (
                Math.abs(t.x - x) <= q[0] + f[0] &&
                Math.abs(t.z - z) <= q[1] + f[1]
              );
            })
          );
        }
        function reduce(state, a) {
          if (!state || !a) return { state, changed: false };
          let s, x, y, z, id;
          if (a.type === "placeBlock") {
            x = snap(a.x);
            y = snap(a.y);
            z = snap(a.z);
            if (
              !BLOCK_TYPES.includes(a.blockType) ||
              !bounded(x) ||
              !bounded(z) ||
              !Number.isInteger(y) ||
              y < 0 ||
              y > 12 ||
              state.userBlocks.length >= MAX_BLOCKS ||
              occupied(state, x, y, z)
            )
              return { state, changed: false };
            s = cloneState(state);
            s.userBlocks.push({ id: s.nextId++, type: a.blockType, x, y, z });
            return { state: s, changed: true };
          }
          if (a.type === "placeTemplate") {
            x = snap(a.x);
            z = snap(a.z);
            y = Math.max(0, snap(a.y || 0));
            if (
              !TEMPLATE_TYPES.includes(a.templateType) ||
              !bounded(x) ||
              !bounded(z) ||
              state.templates.length >= 40 ||
              templateBlocked(state, a.templateType, x, z)
            )
              return { state, changed: false };
            s = cloneState(state);
            s.templates.push({
              id: s.nextId++,
              type: a.templateType,
              x,
              y,
              z,
              rotation: snap(a.rotation || 0) % 4,
            });
            return { state: s, changed: true };
          }
          if (a.type === "deleteObject") {
            id = Number(a.id);
            const block = state.userBlocks.find((o) => o.id === id),
              tpl = state.templates.find((o) => o.id === id);
            if (
              !Number.isInteger(id) ||
              ![...state.userBlocks, ...state.templates, ...state.plants].some(
                (o) => o.id === id,
              )
            )
              return { state, changed: false };
            s = cloneState(state);
            s.userBlocks = s.userBlocks.filter((o) => o.id !== id);
            s.templates = s.templates.filter((o) => o.id !== id);
            s.plants = s.plants.filter(
              (o) =>
                o.id !== id &&
                !(
                  block &&
                  block.type === "soil" &&
                  o.x === block.x &&
                  o.z === block.z &&
                  o.y === block.y + 1
                ) &&
                !(
                  tpl &&
                  tpl.type === "raisedBed" &&
                  inFootprint(tpl, o.x, o.z) &&
                  o.y === tpl.y + 1
                ),
            );
            return { state: s, changed: true };
          }
          if (a.type === "plant") {
            x = snap(a.x);
            z = snap(a.z);
            y = Math.max(0, snap(a.y || 0));
            if (
              !SPECIES[a.species] ||
              !bounded(x) ||
              !bounded(z) ||
              state.plants.length >= 100 ||
              state.plants.some((p) => p.x === x && p.z === z)
            )
              return { state, changed: false };
            s = cloneState(state);
            s.plants.push({
              id: s.nextId++,
              species: a.species,
              x,
              y,
              z,
              stage: 0,
              progress: 0,
              moisture: 0,
              pollinated: false,
            });
            return { state: s, changed: true };
          }
          if (a.type === "waterPlant") {
            id = Number(a.id);
            const p = state.plants.find((q) => q.id === id);
            if (!p || p.moisture >= 0.98) return { state, changed: false };
            s = cloneState(state);
            s.plants.find((q) => q.id === id).moisture = 1;
            return { state: s, changed: true };
          }
          if (a.type === "pollinate") {
            id = Number(a.id);
            const p = state.plants.find((q) => q.id === id);
            if (!p || p.pollinated) return { state, changed: false };
            s = cloneState(state);
            s.plants.find((q) => q.id === id).pollinated = true;
            return { state: s, changed: true };
          }
          if (a.type === "setSeason") {
            if (!SEASONS.includes(a.season) || state.season === a.season)
              return { state, changed: false };
            s = cloneState(state);
            s.season = a.season;
            return { state: s, changed: true };
          }
          if (a.type === "setWeather") {
            if (!WEATHER.includes(a.weather) || state.weather === a.weather)
              return { state, changed: false };
            s = cloneState(state);
            s.weather = a.weather;
            return { state: s, changed: true };
          }
          if (a.type === "setSound") {
            if (typeof a.sound !== "boolean" || state.sound === a.sound)
              return { state, changed: false };
            s = cloneState(state);
            s.sound = a.sound;
            return { state: s, changed: true };
          }
          return { state, changed: false };
        }
        function update(state, seconds) {
          const dt = Math.max(0, Math.min(240, Number(seconds) || 0));
          if (!dt) return state;
          const s = cloneState(state);
          s.elapsed += dt;
          s.plants.forEach((p) => {
            const sp = SPECIES[p.species],
              authoredRoof =
                (Math.abs(p.x - 10) <= 2 && Math.abs(p.z + 7) <= 2) ||
                (Math.abs(p.x - 12) <= 2 && Math.abs(p.z - 7) <= 2) ||
                (Math.abs(p.x + 10) <= 2 && Math.abs(p.z - 7) <= 2) ||
                (Math.abs(p.x + 11) <= 2 && Math.abs(p.z + 7) <= 2),
              covered =
                authoredRoof ||
                s.userBlocks.some(
                  (b) => b.x === p.x && b.z === p.z && b.y > p.y,
                ) ||
                s.templates.some(
                  (t) => t.type === "gazebo" && inFootprint(t, p.x, p.z),
                );
            if (s.weather === "rain" && !covered) p.moisture = 1;
            else p.moisture = Math.max(0, p.moisture - dt * 0.0015);
            if (s.season === "winter" || p.moisture <= 0.08) return;
            const next = p.progress + dt;
            let max = STAGE_SECONDS * 7;
            if (sp.needsInsect && !p.pollinated) {
              if (next >= STAGE_SECONDS * 6.6) p.pollinated = true;
              else max = STAGE_SECONDS * 6 - 0.001;
            }
            if (sp.flowerCrop) max = STAGE_SECONDS * 6 - 0.001;
            p.progress = Math.min(max, next);
            p.stage = Math.min(7, Math.floor(p.progress / STAGE_SECONDS));
            if (sp.selfPollinating && p.stage >= 5) p.pollinated = true;

            (mode === "garden" ? "🌻 " : "🧱 ") + text;
        }
        function setMode(m) {
          mode = m;
          tool = m === "garden" ? "sunflower" : "grass";
          selectedId = null;
          clearGhost();
          document.getElementById("card").classList.add("hidden");
          trays();
          ui();
        }
        document.getElementById("garden-mode").onclick = () =>
          setMode("garden");
        document.getElementById("build-mode").onclick = () => setMode("build");
        document.getElementById("undo").onclick = undo;
        document.getElementById("delete").onclick = () =>
          selectedId &&
          transaction({ type: "deleteObject", id: selectedId }, "Removed");
        const home = {
          theta: 0.72,
          phi: 0.78,
          zoom: 1,
          target: new THREE.Vector3(),
        };
        let view = {
            theta: 0.72,
            phi: 0.78,
            zoom: 1,
            target: new THREE.Vector3(),
          },
          desired = {
            theta: 0.72,
            phi: 0.78,
            zoom: 1,
            target: new THREE.Vector3(),
          };
        document.getElementById("home").onclick = () => {
          desired.theta = home.theta;
          desired.phi = home.phi;
          desired.zoom = home.zoom;
          desired.target.set(0, 0, 0);
          toast("Home view");
        };
        function setZoom(nextZoom) {
          desired.zoom = Math.max(0.65, Math.min(6, nextZoom));
        }
        document.getElementById("zoom-in").onclick = () => {
          setZoom(desired.zoom * 1.55);
          toast("Zooming closer");
        };
        document.getElementById("zoom-out").onclick = () => {
          setZoom(desired.zoom / 1.55);
          toast("Zooming out");
        };
        document
          .querySelectorAll("[data-season]")
          .forEach(
            (b) =>
              (b.onclick = () =>
                transaction(
                  { type: "setSeason", season: b.dataset.season },
                  `${b.textContent.trim()} is here`,
                )),
          );
        document
          .querySelectorAll("[data-weather]")
          .forEach(
            (b) =>
              (b.onclick = () =>
                transaction(
                  { type: "setWeather", weather: b.dataset.weather },
                  b.dataset.weather === "rain"
                    ? "Rain waters open soil"
                    : "Sunshine returns",
                )),
          );
        const envs = {
          spring: [0xdedcf2, 0xe5e3ef, 0xdce9ff, 0xffdda2],
          summer: [0xb9dce7, 0xcce4e4, 0xe9f7ff, 0xffd071],
          autumn: [0xe8c8b1, 0xead6c2, 0xf6e0d1, 0xffbb68],
          winter: [0xcfd9e3, 0xdce4e9, 0xe8f1ff, 0xdde4ee],
        };
        function environment() {
          const e = envs[state.season];
          scene.background = new THREE.Color(e[0]);
          scene.fog = new THREE.Fog(e[1], 42, 85);
          hemi.color.setHex(e[2]);
          sun.color.setHex(e[3]);
          sun.intensity = state.weather === "rain" ? 1.25 : 2.6;
          renderer.toneMappingExposure = state.weather === "rain" ? 0.86 : 1;
          if (grassBatch)
            grassBatch.material.color.setHex(
              {
                spring: 0x6ea34d,
                summer: 0x4f9143,
                autumn: 0x8f954b,
                winter: 0xb8c9b8,
              }[state.season],
            );
          staticRoot.traverse((o) => {
            if (o.userData.leaf || o.userData.leafBatch) {
              o.visible = state.season !== "winter";
              const palettes = {
                spring: o.userData.bloom
                  ? [0xf4c8d9, 0xffe4ea, 0xf0b8cf]
                  : [0x62a153, 0x78ad5e, 0x4d8845],
                summer: [0x477f3f, 0x5d9147, 0x39723a],
                autumn: [0xc0713e, 0xda9445, 0xa9573d],
              };
              if (o.visible)
                o.material.color.setHex(
                  palettes[state.season][o.userData.shade],
                );
            }
            if (o.userData.flower) o.visible = state.season !== "winter";
            if (o.userData.frost) o.visible = state.season === "winter";
          });
          document
            .querySelectorAll("[data-season]")
            .forEach((b) =>
              b.setAttribute("aria-pressed", b.dataset.season === state.season),
            );
          document
            .querySelectorAll("[data-weather]")
            .forEach((b) =>
              b.setAttribute(
                "aria-pressed",
                b.dataset.weather === state.weather,
              ),
            );
          audioMix();
        }
        let ac, wind, rain, buzz, waterSound;
        function audioInit() {
          if (ac) return;
          ac = new (window.AudioContext || window.webkitAudioContext)();
          const master = ac.createGain();
          master.gain.value = 0.035;
          master.connect(ac.destination);
          function noise(freq, type) {
            const buffer = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate),
              data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++)
              data[i] = Math.random() * 2 - 1;
            const src = ac.createBufferSource(),
              filter = ac.createBiquadFilter(),
              gain = ac.createGain();
            src.buffer = buffer;
            src.loop = true;
            filter.type = type;
            filter.frequency.value = freq;
            gain.gain.value = 0;
            src.connect(filter).connect(gain).connect(master);
            src.start();
            return gain;
          }
          function hum(freq) {
            const o = ac.createOscillator(),
              g = ac.createGain();
            o.type = "sawtooth";
            o.frequency.value = freq;
            g.gain.value = 0;
            o.connect(g).connect(master);
            o.start();
            return g;
          }
          wind = noise(430, "lowpass");
          rain = noise(1500, "bandpass");
          waterSound = noise(720, "bandpass");
          buzz = hum(148);
        }
        function chirp() {
          if (
            !ac ||
            !state.sound ||
            state.weather === "rain" ||
            state.season === "winter"
          )
            return;
          const o = ac.createOscillator(),
            g = ac.createGain(),
            n = ac.currentTime;
          o.type = "sine";
          o.frequency.setValueAtTime(1100, n);
          o.frequency.exponentialRampToValueAtTime(1900, n + 0.16);
          g.gain.setValueAtTime(0, n);
          g.gain.linearRampToValueAtTime(0.06, n + 0.03);
          g.gain.exponentialRampToValueAtTime(0.001, n + 0.25);
          o.connect(g).connect(ac.destination);
          o.start(n);
          o.stop(n + 0.26);
        }
        function audioMix() {
          if (!ac) return;
          const n = ac.currentTime,
            on = state.sound;
          wind.gain.setTargetAtTime(
            on ? (state.season === "autumn" ? 0.12 : 0.07) : 0,
            n,
            0.3,
          );
          rain.gain.setTargetAtTime(
            on && state.weather === "rain" ? 0.12 : 0,
            n,
            0.25,
          );
          waterSound.gain.setTargetAtTime(on ? 0.035 : 0, n, 0.4);
          buzz.gain.setTargetAtTime(
            on && state.weather === "sun" && state.season !== "winter"
              ? 0.035
              : 0,
            n,
            0.3,
          );
        }
        document.getElementById("sound").onclick = () => {
          audioInit();
          if (ac.state === "suspended") ac.resume();
          const turningOn = !state.sound;
          transaction(
            { type: "setSound", sound: turningOn },
            turningOn ? "Garden sounds on" : "Sound off",
          );
          if (turningOn) setTimeout(chirp, 250);
        };
        const pointers = new Map();
        let moved = false,
          multi = false,
          lastCenter,
          lastDist;
        canvas.addEventListener("pointerdown", (e) => {
          canvas.setPointerCapture(e.pointerId);
          pointers.set(e.pointerId, {
            x: e.clientX,
            y: e.clientY,
            sx: e.clientX,
            sy: e.clientY,
          });
          if (pointers.size === 1) {
            moved = false;
            multi = false;
          } else {
            multi = true;
            const a = [...pointers.values()];
            lastCenter = { x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2 };
            lastDist = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
          }
        });
        canvas.addEventListener(
          "pointermove",
          (e) => {
            const p = pointers.get(e.pointerId);
            if (!p) return;
            const dx = e.clientX - p.x,
              dy = e.clientY - p.y;
            p.x = e.clientX;
            p.y = e.clientY;
            if (Math.hypot(e.clientX - p.sx, e.clientY - p.sy) > 8)
              moved = true;
            if (pointers.size === 1 && !multi) {
              desired.theta -= dx * 0.007;
              desired.phi = Math.max(
                0.38,
                Math.min(1.18, desired.phi - dy * 0.006),
              );
            } else if (pointers.size >= 2) {
              moved = true;
              const a = [...pointers.values()],
                c = { x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2 },
                dist = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
              desired.zoom = Math.max(
                0.65,
                Math.min(6, (desired.zoom * dist) / Math.max(1, lastDist)),
              );
              const q = 0.025 / Math.sqrt(desired.zoom),
                A = desired.theta;
              desired.target.x +=
                (-Math.cos(A) * (c.x - lastCenter.x) +
                  Math.sin(A) * (c.y - lastCenter.y)) *
                q;
              desired.target.z +=
                (-Math.sin(A) * (c.x - lastCenter.x) -
                  Math.cos(A) * (c.y - lastCenter.y)) *
                q;
              desired.target.x = Math.max(-18, Math.min(18, desired.target.x));
              desired.target.z = Math.max(-15, Math.min(15, desired.target.z));
              lastCenter = c;
              lastDist = dist;
            }
            e.preventDefault();
          },
          { passive: false },
        );
        function end(e) {
          const p = pointers.get(e.pointerId),
            count = pointers.size;
          pointers.delete(e.pointerId);
          if (p && !moved && !multi && count === 1) tap(e.clientX, e.clientY);
          if (!pointers.size) {
            moved = false;
            multi = false;
          }
        }
        canvas.addEventListener("pointerup", end);
        canvas.addEventListener("pointercancel", (e) => {
          pointers.delete(e.pointerId);
          moved = true;
          multi = true;
        });
        canvas.addEventListener("lostpointercapture", (e) =>
          pointers.delete(e.pointerId),
        );
        canvas.addEventListener(
          "wheel",
          (e) => {
            setZoom(desired.zoom * Math.exp(-e.deltaY * 0.0015));
            e.preventDefault();
          },
          { passive: false },
        );
        function resize() {
          const w = innerWidth,
            h = innerHeight;
          if (
            w === lastWidth &&
            h === lastHeight &&
            Math.abs(view.zoom - lastZoom) < 0.001
          )
            return;
          const aspect = w / h,
            size = (w < h ? 35 : 24) / view.zoom;
          camera.left = -size * aspect;
          camera.right = size * aspect;
          camera.top = size;
          camera.bottom = -size;
          camera.near = 0.1;
          camera.far = 160;
          camera.updateProjectionMatrix();
          if (w !== lastWidth || h !== lastHeight)
            renderer.setSize(w, h, false);
          lastWidth = w;
          lastHeight = h;
          lastZoom = view.zoom;
        }
        function cam() {
          view.theta += (desired.theta - view.theta) * 0.09;
          view.phi += (desired.phi - view.phi) * 0.09;
          view.zoom += (desired.zoom - view.zoom) * 0.09;
          view.target.lerp(desired.target, 0.09);
          const r = 47,
            c = Math.cos(view.phi);
          camera.position.set(
            view.target.x + r * Math.sin(view.theta) * c,
            view.target.y + r * Math.sin(view.phi),
            view.target.z + r * Math.cos(view.theta) * c,
          );
          camera.lookAt(view.target);
          resize();
        }
        function pollenAt(p) {
          const burst = new THREE.Group();
          for (let i = 0; i < 10; i++) {
            const a = (i / 10) * Math.PI * 2,
              s = cube(
                0xffdf58,
                [0.1, 0.1, 0.1],
                [
                  Math.cos(a) * 0.55,
                  1.4 + Math.sin(i * 2) * 0.25,
                  Math.sin(a) * 0.55,
                ],
                new THREE.MeshBasicMaterial({ color: 0xffdf58 }),
              );
            burst.add(s);
          }
          burst.position.set(p.x, p.y, p.z);
          scene.add(burst);
          setTimeout(() => scene.remove(burst), 900);
        }
        function motion(t, dt) {
          const active = state.weather === "sun" && state.season !== "winter",
            hives = state.templates.filter((q) => q.type === "beehive").length,
            extraFlowers = state.userBlocks.filter(
              (q) => q.type === "flowers",
            ).length,
            activeCount = Math.min(
              wildlife.length,
              (state.season === "summer" ? 6 : 4) +
                hives +
                Math.floor(extraFlowers / 3),
            );
          wildRoot.visible = active;
          const eligible = state.plants.filter(
              (p) =>
                p.stage === 5 &&
                M.SPECIES[p.species].needsInsect &&
                !p.pollinated,
            ),
            springMix = [0, 1, 5, 6, 2, 7, 3, 4],
            order =
              state.season === "spring" ? springMix : [0, 1, 2, 3, 4, 5, 6, 7];
          wildlife.forEach((w, i) => {
            w.visible = active && order.indexOf(i) < activeCount;
            if (!w.visible) return;
            const plant = eligible.length
                ? eligible[(i + Math.floor(t / 8000)) % eligible.length]
                : null,
              target = plant
                ? new THREE.Vector3(plant.x, plant.y + 1.1, plant.z)
                : flowerTargets[
                    (Math.floor(t * 0.00006) + w.userData.target) %
                      flowerTargets.length
                  ],
              a = t * 0.00065 * (w.userData.bee ? 1.4 : 0.9) + w.userData.phase,
              r = plant ? 0.55 : 1.2 + (i % 3) * 0.4;
            w.position.set(
              target.x + Math.cos(a * 4) * r,
              target.y + 1.1 + Math.sin(a * 6) * 0.25,
              target.z + Math.sin(a * 4) * r,
            );
            w.rotation.y = -a * 4;
            if (plant && t - w.userData.lastVisit > 6500) {
              w.userData.lastVisit = t;
              const q = M.reduce(state, { type: "pollinate", id: plant.id });
              if (q.changed) {
                state = q.state;
                pollenAt(plant);
                rebuild();
                save();
                toast(
                  `${w.userData.bee ? "A bee" : "A butterfly"} shared pollen ✨`,
                );
              }
            }
          });
          birds.forEach((b, i) => {
            b.visible = active;
            const a = t * 0.00018 + b.userData.phase;
            b.position.set(Math.cos(a) * 20, 10 + i * 1.5, Math.sin(a) * 15);
            b.rotation.y = -a;
          });
          fish.forEach((koi) => {
            const data = koi.userData;
            const angle = t * data.speed + data.phase;
            const x = -1 + Math.cos(angle) * data.radiusX;
            const z = -4 + Math.sin(angle) * data.radiusZ;
            const dx = -Math.sin(angle) * data.radiusX;
            const dz = Math.cos(angle) * data.radiusZ;
            koi.position.set(x, 0.17 + Math.sin(angle * 2.4) * 0.018, z);
            koi.rotation.y = Math.atan2(dx, dz);
            data.tail.rotation.y = Math.PI / 4 + Math.sin(t * 0.01 + data.phase) * 0.48;
          });
          particles.forEach((p, i) => {
            const firefly =
                state.season === "summer" && state.weather === "sun",
              show =
                firefly ||
                state.weather === "rain" ||
                state.season === "spring" ||
                state.season === "autumn";
            p.visible = show;
            if (!show) return;
            if (firefly) {
              p.material.color.setHex(0xffe96b);
              p.scale.setScalar(0.065);
              p.position.set(
                p.userData.weatherX * 0.9,
                0.7 + Math.sin(t * 0.002 + p.userData.phase) * 0.45,
                p.userData.weatherZ * 0.9,
              );
              return;
            }
            p.material.color.setHex(
              state.weather === "rain"
                ? state.season === "winter"
                  ? 0xffffff
                  : 0x9bd8ee
                : state.season === "autumn"
                  ? 0xd68542
                  : 0xf3bed2,
            );
            const winterSnow =
              state.weather === "rain" && state.season === "winter";
            if (winterSnow) p.scale.set(0.13, 0.13, 0.13);
            else if (state.weather === "rain")
              p.scale.set(0.045, p.userData.rainLength, 0.045);
            else p.scale.set(0.12, 0.04, 0.12);
            const fallSpeed = winterSnow
              ? 0.0018
              : state.weather === "rain"
                ? 0.006
                : 0.0015;
            const speed =
                state.weather === "rain"
                  ? winterSnow
                    ? 0.0018
                    : p.userData.rainSpeed
                  : fallSpeed,
              travel = t * speed + p.userData.weatherOffset,
              particleY = 14 - (travel % 17),
              cycle = Math.floor(travel / 17),
              respawnX = (rand(i, cycle + 230) - 0.5) * 5,
              respawnZ = (rand(cycle + 250, i) - 0.5) * 4;
            p.position.set(
              p.userData.weatherX +
                respawnX +
                Math.sin(t * 0.0007 + p.userData.phase) *
                  (state.weather === "rain" ? p.userData.drift : 1),
              particleY,
              p.userData.weatherZ +
                respawnZ +
                (state.weather === "rain"
                  ? p.userData.drift * (14 - particleY) * 0.08
                  : 0),
            );
          });
          staticRoot.children.forEach((o, i) => {
            if (o.userData.cloud) {
              o.position.x += dt * 0.15 * (i % 2 ? 1 : -1);
              if (Math.abs(o.position.x) > 42) o.position.x *= -1;
            }
            if (o.userData.flower)
              o.rotation.z = Math.sin(t * 0.0015 + o.position.x) * 0.05;
          });
          water.material.opacity = 0.55 + Math.sin(t * 0.001) * 0.04;
          ripples.forEach((r, i) => {
            const s = 1 + ((t * 0.0002 + i * 0.3) % 1);
            r.scale.set(1.5 * s, 0.8 * s, 1);
            r.material.opacity = 0.28 * (2 - s);
          });
        }
        let acc = 0;
        function frame(t) {
          requestAnimationFrame(frame);
          const dt = Math.min(0.1, clock.getDelta());
          acc += dt;
          if (acc >= 1 && document.visibilityState === "visible") {
            state = M.update(state, acc);
            acc = 0;
            const sig = state.plants
              .map((p) => `${p.id}:${p.stage}:${p.moisture < 0.1}`)
              .join("|");
            if (sig !== lastPlantSig) {
              lastPlantSig = sig;
              rebuild();
              if (state.plants.some((p) => p.id === selectedId))
                inspect(selectedId);
            }
            if (performance.now() - lastSave > 10000) save();
          }
          motion(t, dt);
          cam();
          renderer.render(scene, camera);
        }
        function fail(m) {
          document.getElementById("error-text").textContent = m;
          document.getElementById("error").style.display = "grid";
        }
        try {
          load();
          island();
          wildlifeSetup();
          rebuild();
          environment();
          trays();
          ui();
          resize();
          window.GardenDebug = {
            snapshot: () => M.cloneState(state),
            project: (x, y, z) => {
              const v = new THREE.Vector3(x, y, z).project(camera);
              return {
                x: ((v.x + 1) * innerWidth) / 2,
                y: ((1 - v.y) * innerHeight) / 2,
              };
            },
            scene,
            THREE,
          };
          requestAnimationFrame(frame);
        } catch (e) {
          console.error(e);
          fail(e.message || "The garden could not be created.");
        }
      })();
    </script>
  </body>
